[workspace]
name = "snax-forge-experiments"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
numpy = ">=1.26,<2"
matplotlib = ">=3.11.2,<4"

[tasks]
# The flows (docs/TOOL.md): synthesis, power, the bundles of each source
syn = "python syn/syn.py"
pwr = "python sim/pwr.py"
forge-rtl = "python forge/bundles.py"
char-rtl = "python char/blocks.py"
strm-rtl = "python strm/gen.py"
cluster = "python cluster/cluster.py"
# CACTI 7 at a fixed commit into ram/cacti/ (git-ignored), built with the host g++; then the SRAM table and macros
ram-build = "test -d ram/cacti/.git || git clone https://github.com/HewlettPackard/cacti ram/cacti && git -C ram/cacti checkout -q 1ffd8df && make -C ram/cacti"
ram = "python ram/ram.py"
# The tables HWCOST reads and the block model
strm-table = "python report/strm_table.py"
xbar-kinds = "python report/xbar_kinds.py"
char-export = "python report/char_export.py"
char-table = "python report/char_table.py"
# The cluster against HWCOST
cluster-hwcost = "python cluster/hwcost.py"
cluster-breakdown = "python report/cluster_breakdown.py"
cluster-energy = "python report/cluster_energy.py"
cluster-sweep = "python report/cluster_sweep.py"
# forge against the HLS tools
import-cycles = "python report/import_cycles.py"
compare = "python report/compare.py"
compare-hls = "python report/compare_hls.py"
# The zips (check, ls, cat), the tests (no EDA tool) and the lint (ruff's F rules, fetched by pixi exec)
arc = "python arc/arc.py"
test = "python arc/test_arc.py && python cluster/test_check.py && python cluster/test_mem.py && python cluster/test_power.py && python cluster/test_tree.py && python report/test_char_export.py && python report/test_cluster_breakdown.py && python report/test_cluster_energy.py && python report/test_cluster_sweep.py && python report/test_strm_table.py && python report/test_xbar_kinds.py && python strm/test_xbar_mix.py && python sim/test_forge_stream.py && python syn/test_clk_gate.py"
lint = "pixi exec ruff check --isolated --select F ."
