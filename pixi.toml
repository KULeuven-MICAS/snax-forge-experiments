[workspace]
name = "snax-forge-experiments"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
numpy = ">=1.26,<2"
matplotlib = ">=3.11.2,<4"

[tasks]
syn = "python syn/syn.py"
pwr = "python sim/pwr.py"
forge-rtl = "python forge/bundles.py"
char-rtl = "python char/blocks.py"
char-table = "python report/char_table.py"
table = "python report/forge_vs_hls.py"
analysis = "python report/analysis_syn1.py"
split = "python report/flop_split.py"
control = "python report/control_roles.py"
syn2 = "python report/analysis_syn2.py"
