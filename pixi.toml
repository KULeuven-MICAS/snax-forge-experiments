[workspace]
name = "snax-forge-experiments"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
numpy = ">=1.26,<2"
matplotlib = ">=3.11.2,<4"

[tasks]
syn = "python syn/syn.py"
pwr = "python sim/pwr.py"
forge-rtl = "python forge/bundles.py"
char-rtl = "python char/blocks.py"
char-export = "python report/char_export.py"
char-table = "python report/char_table.py"
import-cycles = "python report/import_cycles.py"
compare = "python report/compare.py"
compare-hls = "python report/compare_hls.py"
# RAM1: clone CACTI 7 at a fixed commit into ram/cacti/ (git-ignored) and build it with the host g++
ram-build = "test -d ram/cacti/.git || git clone https://github.com/HewlettPackard/cacti ram/cacti && git -C ram/cacti checkout -q 1ffd8df && make -C ram/cacti"
ram = "python ram/ram.py"
# ARC1: outputs zipped one per point (X51): check, migrate, ls, cat; and the helpers' tests
arc = "python arc/arc.py"
arc-test = "python arc/test_arc.py"
# STRM1: the streamer reader and sparse interconnect bundles, rtl/streamer/ and rtl/xbar/ (strm/grid.json)
strm-rtl = "python strm/gen.py"
# STRM1 R1: the reader and interconnect tables and their reference interpolation (X53), and its tests
strm-table = "python report/strm_table.py"
strm-table-test = "python report/test_strm_table.py"
# CSYN1 Part B: a snax-forge design in snax_cluster's whole cluster (X66, X67): rtl (R2), syn (R3), gls (R4)
cluster = "python cluster/cluster.py"
